<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title> Flappy Bird - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            width: 1000px;
            height: 1000px;
            background: linear-gradient(to bottom, #4ec0ca 0%, #87ceeb 50%, #e0f6ff 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: background 1.5s ease;
        }

        /* Time-based backgrounds */
        .game-container.morning {
            background: linear-gradient(to bottom, #FFB347 0%, #FFCC70 50%, #FFF8DC 100%);
        }

        .game-container.afternoon {
            background: linear-gradient(to bottom, #4ec0ca 0%, #87ceeb 50%, #e0f6ff 100%);
        }

        .game-container.evening {
            background: linear-gradient(to bottom, #FF6B6B 0%, #FF8E53 50%, #FFB84D 100%);
        }

        .game-container.night {
            background: linear-gradient(to bottom, #0F2027 0%, #203A43 50%, #2C5364 100%);
        }

        /* Clouds Animation */
        .clouds {
            position: absolute;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 100px;
            animation: float 20s linear infinite;
        }

        .cloud:before, .cloud:after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 100px;
        }

        .cloud1 { width: 80px; height: 30px; top: 50px; left: -80px; }
        .cloud1:before { width: 50px; height: 40px; top: -20px; left: 10px; }
        .cloud1:after { width: 60px; height: 35px; top: -15px; right: 10px; }

        .cloud2 { width: 100px; height: 35px; top: 150px; left: -100px; animation-delay: 8s; }
        .cloud2:before { width: 60px; height: 45px; top: -25px; left: 15px; }
        .cloud2:after { width: 70px; height: 40px; top: -20px; right: 15px; }

        .cloud3 { width: 70px; height: 28px; top: 250px; left: -70px; animation-delay: 4s; }
        .cloud3:before { width: 45px; height: 38px; top: -18px; left: 12px; }
        .cloud3:after { width: 55px; height: 33px; top: -15px; right: 12px; }

        .cloud4 { width: 90px; height: 32px; top: 350px; left: -90px; animation-delay: 12s; }
        .cloud4:before { width: 55px; height: 42px; top: -22px; left: 14px; }
        .cloud4:after { width: 65px; height: 37px; top: -18px; right: 14px; }

        .cloud5 { width: 75px; height: 29px; top: 100px; left: -75px; animation-delay: 16s; }
        .cloud5:before { width: 48px; height: 39px; top: -19px; left: 11px; }
        .cloud5:after { width: 58px; height: 34px; top: -16px; right: 11px; }

        @keyframes float {
            to { transform: translateX(480px); }
        }

        /* Night mode clouds */
        .game-container.night .cloud,
        .game-container.night .cloud:before,
        .game-container.night .cloud:after {
            background: rgba(255, 255, 255, 0.2);
        }

        #gameCanvas {
            position: relative;
            z-index: 2;
        }

        /* Start Screen */
        .start-screen, .game-over-screen, .character-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .hidden {
            display: none !important;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            animation: bounce 1s infinite;
            line-height: 1.5;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .btn {
            padding: 15px 30px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-family: 'Press Start 2P', cursive;
            line-height: 1.5;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Score Display */
        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* Lives Display */
        .lives-display {
            position: absolute;
            top: 60px;
            left: 20px;
            font-size: 16px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            font-family: 'Press Start 2P', cursive;
        }

        /* Star Counter Display */
        .star-counter {
            position: absolute;
            top: 60px;
            right: 20px;
            font-size: 16px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            font-family: 'Press Start 2P', cursive;
        }

        /* Game Over Screen */
        .game-over-content {
            text-align: center;
            color: white;
        }

        .game-over-title {
            font-size: 32px;
            color: #ff6b6b;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            line-height: 1.5;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .medal {
            font-size: 40px;
            margin: 10px 0;
        }

        /* Character Selection */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            backdrop-filter: blur(10px);
        }

        .character-card:hover {
            transform: scale(1.05);
            border-color: #FFD700;
        }

        .character-card.selected {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
        }

        .character-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .character-name {
            color: white;
            font-weight: bold;
            font-size: 12px;
            line-height: 1.5;
        }

        /* Leaderboard */
        .leaderboard {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            margin: 20px;
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            color: white;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            line-height: 1.5;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .rank {
            font-weight: bold;
            color: #FFD700;
        }

        /* Instructions */
        .instructions {
            color: white;
            font-size: 12px;
            margin: 20px;
            text-align: center;
            line-height: 1.8;
        }

        /* Difficulty Selection */
        .difficulty-select {
            margin: 20px;
            width: 90%;
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .difficulty-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .difficulty-card:hover {
            transform: scale(1.05);
            border-color: #FFD700;
        }

        .difficulty-card.selected {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
        }

        .difficulty-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .difficulty-name {
            color: white;
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .difficulty-desc {
            color: rgba(255, 255, 255, 0.8);
            font-size: 9px;
            line-height: 1.3;
        }

        .difficulty-label {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        /* Pipe Type Selection */
        .pipe-select {
            margin: 10px;
            width: 95%;
        }

        .pipe-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: px;
            margin-top: 15px;
        }

        .pipe-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .pipe-card:hover {
            transform: scale(1.05);
            border-color: #FFD700;
        }

        .pipe-card.selected {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
        }

        .pipe-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .pipe-name {
            color: white;
            font-weight: bold;
            font-size: 11px;
            line-height: 1.3;
        }

        .pipe-label {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        /* Mobile Responsive */
        @media (max-width: 450px) {
            .game-container {
                width: 100vw;
                height: 100vh;
                height: 100dvh; /* Dynamic viewport height for mobile */
                border-radius: 0;
            }
            
            body {
                margin: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                position: fixed;
                overflow: hidden;
            }
            
            .title {
                font-size: 24px;
            }
            
            .btn {
                font-size: 11px;
                padding: 12px 25px;
            }
        }

        /* Prevent pull-to-refresh and other gestures */
        body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
        }
    </style>
</head>
<body>
    <div class="game-container afternoon" id="gameContainer">
        <!-- Clouds Background -->
        <div class="clouds">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
            <div class="cloud cloud4"></div>
            <div class="cloud cloud5"></div>
        </div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Score Display -->
        <div class="score-display" id="scoreDisplay">0</div>
        
        <!-- Lives Display -->
        <div class="lives-display" id="livesDisplay">Nyawa: ❤️❤️❤️</div>
        
        <!-- Star Counter Display -->
        <div class="star-counter" id="starCounter">⭐ 0</div>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <div class="title"> FLAPPY BIRD</div>
            <div class="instructions">
                🎮 Tap/Spasi untuk bermain<br>
                ‼️Hindari pipa untuk bertahan hidup
            </div>
            <div class="difficulty-select">
                <div class="difficulty-label">Pilih Kesulitan:</div>
                <div class="difficulty-grid">
                    <div class="difficulty-card selected" data-difficulty="easy">
                        <div class="difficulty-name">Ezett</div>
                        <div class="difficulty-desc">3 Nyawa</div>
                    </div>
                    <div class="difficulty-card" data-difficulty="medium">
                        <div class="difficulty-name">Sedang</div>
                        <div class="difficulty-desc">2 Nyawa</div>
                    </div>
                    <div class="difficulty-card" data-difficulty="hard">
                        <div class="difficulty-name">Sulit</div>
                        <div class="difficulty-desc">1 Nyawa</div>
                    </div>
                </div>
            </div>
            <button class="btn" id="selectCharBtn">Pilih Karakter</button>
            <button class="btn" id="selectPipeBtn">Pilih Rintangan</button>
            <button class="btn" id="startBtn">Mulai Main</button>
            <button class="btn" id="leaderboardBtn">Leaderboard</button>
        </div>

        <!-- Character Selection Screen -->
        <div class="character-select hidden" id="characterSelect">
            <div class="title" style="font-size: 20px;">Pilih Karakter</div>
            <div class="character-grid" id="characterGrid">
                <div class="character-card selected" data-char="🦋">
                    <div class="character-icon">🦋</div>
                    <div class="character-name">Butterfly</div>
                </div>
                <div class="character-card" data-char="🐒">
                    <div class="character-icon">🐒</div>
                    <div class="character-name">You</div>
                </div>
                <div class="character-card" data-char="🦉">
                    <div class="character-icon">🦉</div>
                    <div class="character-name">Owl</div>
                </div>
                <div class="character-card" data-char="🐦">
                    <div class="character-icon">🐦</div>
                    <div class="character-name">Bird</div>
                </div>
            </div>
            <button class="btn" id="backFromCharBtn">Kembali</button>
        </div>

        <!-- Pipe Type Selection Screen -->
        <div class="character-select hidden" id="pipeSelect">
            <div class="title" style="font-size: 20px;">Pilih Rintangan</div>
            <div class="pipe-grid">
                <div class="pipe-card selected" data-pipe="pipe">
                    <div class="pipe-icon">⚪</div>
                    <div class="pipe-name">Pipa Putih</div>
                </div>
                <div class="pipe-card" data-pipe="rock">
                    <div class="pipe-icon">🗿</div>
                    <div class="pipe-name">Emot Batu</div>
                </div>
                <div class="pipe-card" data-pipe="spike">
                    <div class="pipe-icon">🕯️</div>
                    <div class="pipe-name">Lilin Api</div>
                </div>
            </div>
            <button class="btn" id="backFromPipeBtn">Kembali</button>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over-screen hidden" id="gameOverScreen">
            <div class="game-over-content">
                <div class="game-over-title">GAME<br>OVER</div>
                <div class="medal" id="medalDisplay"></div>
                <div class="score-board">
                    <div class="score-item">
                        <span>Skor:</span>
                        <span id="finalScore">0</span>
                    </div>
                    <div class="score-item">
                        <span>Terbaik:</span>
                        <span id="bestScore">0</span>
                    </div>
                </div>
                <button class="btn" id="restartBtn">Main Lagi</button>
                <button class="btn" id="menuBtn">Menu</button>
            </div>
        </div>

        <!-- Leaderboard Screen -->
        <div class="start-screen hidden" id="leaderboardScreen">
            <div class="title" style="font-size: 24px;">🏆 LEADER BOARD</div>
            <div class="leaderboard" id="leaderboardList"></div>
            <button class="btn" id="backBtn">Kembali</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');

        // Game State
        let gameState = 'menu';
        let score = 0;
        let lives = 3;
        let maxLives = 3;
        let starsCollected = 0;
        let highScore = localStorage.getItem('flappyHighScore') || 0;
        let selectedCharacter = '🦋';
        let selectedPipeType = 'pipe';
        let difficulty = 'easy';
        let timeOfDay = 'afternoon';
        let invincible = false;
        let invincibleTimer = 0;
        
        // Pipe type configurations
        const pipeTypes = {
            pipe: {
                bodyColor: '#E8E8E8',
                capColor: '#FFFFFF',
                borderColor: '#CCCCCC',
                name: 'Pipa Putih'
            },
            rock: {
                bodyColor: '#5d5d5d',
                capColor: '#808080',
                borderColor: '#3d3d3d',
                name: 'Moai Batu'
            },
            spike: {
                bodyColor: '#8B4513',
                capColor: '#CD853F',
                borderColor: '#654321',
                name: 'Lilin Api'
            }
        };
        
        // Time cycle
        const timeSequence = ['morning', 'afternoon', 'evening', 'night'];
        const timeIcons = {
            morning: '🌅',
            afternoon: '🌞',
            evening: '🌆',
            night: '🌙'
        };
        
        // Auto cycle time based on score
        function autoUpdateTimeOfDay() {
            if (score < 10) {
                timeOfDay = 'morning';
            } else if (score < 25) {
                timeOfDay = 'afternoon';
            } else if (score < 40) {
                timeOfDay = 'evening';
            } else {
                timeOfDay = 'night';
            }
            gameContainer.className = 'game-container ' + timeOfDay;
        }
        
        // Difficulty Settings
        const difficultySettings = {
            easy: {
                pipeSpeed: 2,
                pipeGap: 200,
                spawnInterval: 100,
                gravity: 0.5,
                lives: 3
            },
            medium: {
                pipeSpeed: 3,
                pipeGap: 170,
                spawnInterval: 85,
                gravity: 0.6,
                lives: 2
            },
            hard: {
                pipeSpeed: 4,
                pipeGap: 140,
                spawnInterval: 70,
                gravity: 0.7,
                lives: 1
            }
        };
        
        // Bird Properties
        const bird = {
            x: 80,
            y: 250,
            width: 40,
            height: 40,
            velocity: 0,
            gravity: 0.5,
            jump: -8
        };

        // Pipes
        let pipes = [];
        const pipeWidth = 60;
        const pipeCapHeight = 30;
        const pipeCapWidth = 70;
        let pipeGap = 200;
        let pipeSpeed = 2;
        let spawnInterval = 100;
        let frameCount = 0;

        // Stars
        let stars = [];
        const starSize = 20;

        // Ground
        const groundHeight = 100;
        let groundX = 0;

        // Initialize
        function init() {
            pipes = [];
            stars = [];
            bird.y = 250;
            bird.velocity = 0;
            score = 0;
            starsCollected = 0;
            frameCount = 0;
            invincible = false;
            invincibleTimer = 0;
            timeOfDay = 'morning'; // Reset to morning on start
            gameContainer.className = 'game-container morning';
            
            // Apply difficulty settings
            const settings = difficultySettings[difficulty];
            pipeSpeed = settings.pipeSpeed;
            pipeGap = settings.pipeGap;
            spawnInterval = settings.spawnInterval;
            bird.gravity = settings.gravity;
            lives = settings.lives;
            maxLives = settings.lives;
            
            updateLivesDisplay();
            updateStarCounter();
            document.getElementById('scoreDisplay').textContent = score;
        }

        // Update Lives Display
        function updateLivesDisplay() {
            const livesDisplay = document.getElementById('livesDisplay');
            if (invincible && invincibleTimer > 0) {
                livesDisplay.textContent = 'Nyawa:  ' + '❤️'.repeat(lives);
            } else {
                livesDisplay.textContent = 'Nyawa: ' + '❤️'.repeat(lives);
            }
        }

        // Update Star Counter
        function updateStarCounter() {
            document.getElementById('starCounter').textContent = '⭐ ' + starsCollected;
        }

        // Draw Bird
        function drawBird() {
            if (invincible && Math.floor(frameCount / 10) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            ctx.font = '40px Arial';
            ctx.fillText(selectedCharacter, bird.x, bird.y + bird.height);
            ctx.globalAlpha = 1;
        }

        // Draw Pipes
        function drawPipes() {
            const pipeStyle = pipeTypes[selectedPipeType];
            
            pipes.forEach(pipe => {
                // Top pipe body
                ctx.fillStyle = pipeStyle.bodyColor;
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top - pipeCapHeight);
                
                // Top pipe cap
                ctx.fillStyle = pipeStyle.capColor;
                ctx.fillRect(pipe.x - (pipeCapWidth - pipeWidth) / 2, pipe.top - pipeCapHeight, pipeCapWidth, pipeCapHeight);
                
                // Top pipe cap border
                ctx.strokeStyle = pipeStyle.borderColor;
                ctx.lineWidth = 3;
                ctx.strokeRect(pipe.x - (pipeCapWidth - pipeWidth) / 2, pipe.top - pipeCapHeight, pipeCapWidth, pipeCapHeight);
                
                // Top pipe body border
                ctx.strokeStyle = pipeStyle.capColor;
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top - pipeCapHeight);
                
                // Bottom pipe body
                ctx.fillStyle = pipeStyle.bodyColor;
                ctx.fillRect(pipe.x, pipe.top + pipeGap + pipeCapHeight, pipeWidth, canvas.height - pipe.top - pipeGap - groundHeight - pipeCapHeight);
                
                // Bottom pipe cap
                ctx.fillStyle = pipeStyle.capColor;
                ctx.fillRect(pipe.x - (pipeCapWidth - pipeWidth) / 2, pipe.top + pipeGap, pipeCapWidth, pipeCapHeight);
                
                // Bottom pipe cap border
                ctx.strokeStyle = pipeStyle.borderColor;
                ctx.lineWidth = 3;
                ctx.strokeRect(pipe.x - (pipeCapWidth - pipeWidth) / 2, pipe.top + pipeGap, pipeCapWidth, pipeCapHeight);
                
                // Bottom pipe body border
                ctx.strokeStyle = pipeStyle.capColor;
                ctx.strokeRect(pipe.x, pipe.top + pipeGap + pipeCapHeight, pipeWidth, canvas.height - pipe.top - pipeGap - groundHeight - pipeCapHeight);
                
                // Add texture based on type
                if (selectedPipeType === 'rock') {
                    // Moai face on cap
                    ctx.fillStyle = '#3d3d3d';
                    const capCenterX = pipe.x + pipeWidth / 2;
                    
                    // Top moai eyes
                    ctx.fillRect(capCenterX - 15, pipe.top - pipeCapHeight + 8, 8, 10);
                    ctx.fillRect(capCenterX + 7, pipe.top - pipeCapHeight + 8, 8, 10);
                    // Top moai nose
                    ctx.fillRect(capCenterX - 4, pipe.top - pipeCapHeight + 18, 8, 8);
                    
                    // Bottom moai eyes
                    ctx.fillRect(capCenterX - 15, pipe.top + pipeGap + 8, 8, 10);
                    ctx.fillRect(capCenterX + 7, pipe.top + pipeGap + 8, 8, 10);
                    // Bottom moai nose
                    ctx.fillRect(capCenterX - 4, pipe.top + pipeGap + 18, 8, 8);
                    
                    // Rock cracks on body
                    ctx.strokeStyle = '#3d3d3d';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(pipe.x + 10, pipe.top - pipeCapHeight - 30);
                    ctx.lineTo(pipe.x + 30, pipe.top - pipeCapHeight - 50);
                    ctx.lineTo(pipe.x + 50, pipe.top - pipeCapHeight - 40);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(pipe.x + 15, pipe.top + pipeGap + pipeCapHeight + 30);
                    ctx.lineTo(pipe.x + 35, pipe.top + pipeGap + pipeCapHeight + 50);
                    ctx.lineTo(pipe.x + 45, pipe.top + pipeGap + pipeCapHeight + 40);
                    ctx.stroke();
                } else if (selectedPipeType === 'spike') {
                    // Candle flame effect on cap
                    ctx.fillStyle = '#FFD700';
                    ctx.shadowColor = '#FFA500';
                    ctx.shadowBlur = 15;
                    
                    for (let i = 0; i < 4; i++) {
                        const x = pipe.x - (pipeCapWidth - pipeWidth) / 2 + 10 + i * 16;
                        // Top flames
                        ctx.beginPath();
                        ctx.moveTo(x, pipe.top - pipeCapHeight);
                        ctx.lineTo(x + 4, pipe.top - pipeCapHeight - 10);
                        ctx.lineTo(x + 8, pipe.top - pipeCapHeight);
                        ctx.fill();
                        
                        // Bottom flames
                        ctx.beginPath();
                        ctx.moveTo(x, pipe.top + pipeGap + pipeCapHeight);
                        ctx.lineTo(x + 4, pipe.top + pipeGap + pipeCapHeight + 10);
                        ctx.lineTo(x + 8, pipe.top + pipeGap + pipeCapHeight);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                    
                    // Candle wax drips on body
                    ctx.fillStyle = '#DEB887';
                    for (let i = 10; i < pipe.top - pipeCapHeight; i += 40) {
                        ctx.beginPath();
                        ctx.arc(pipe.x + 15, i, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(pipe.x + 45, i + 20, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    for (let i = pipe.top + pipeGap + pipeCapHeight + 20; i < canvas.height - groundHeight; i += 40) {
                        ctx.beginPath();
                        ctx.arc(pipe.x + 20, i, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(pipe.x + 50, i + 20, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
        }

        // Draw Stars
        function drawStars() {
            stars.forEach(star => {
                // Star glow effect
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 10;
                ctx.font = `${starSize}px Arial`;
                ctx.fillText('⭐', star.x, star.y + starSize);
                ctx.shadowBlur = 0;
            });
        }

        // Draw Ground
        function drawGround() {
            // Dirt base with gradient
            const dirtGradient = ctx.createLinearGradient(0, canvas.height - groundHeight, 0, canvas.height);
            dirtGradient.addColorStop(0, '#8B4513');
            dirtGradient.addColorStop(1, '#654321');
            ctx.fillStyle = dirtGradient;
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            // Dark soil layer
            ctx.fillStyle = '#5D4E37';
            ctx.fillRect(0, canvas.height - groundHeight + 35, canvas.width, 15);
            
            // Main grass layer - rich green
            const grassGradient = ctx.createLinearGradient(0, canvas.height - groundHeight, 0, canvas.height - groundHeight + 40);
            grassGradient.addColorStop(0, '#2E7D32');
            grassGradient.addColorStop(0.5, '#388E3C');
            grassGradient.addColorStop(1, '#4CAF50');
            ctx.fillStyle = grassGradient;
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 40);
            
            // Top bright grass highlight
            ctx.fillStyle = '#66BB6A';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 8);
            
            // Individual tall grass blades
            ctx.strokeStyle = '#1B5E20';
            ctx.lineWidth = 3;
            for (let i = groundX; i < canvas.width + 20; i += 6) {
                const height = 12 + Math.sin(i * 0.5) * 3;
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - groundHeight + 18);
                ctx.quadraticCurveTo(
                    i - 2, 
                    canvas.height - groundHeight + 8, 
                    i - 1, 
                    canvas.height - groundHeight
                );
                ctx.stroke();
            }
            
            // Medium grass blades
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 2;
            for (let i = groundX + 3; i < canvas.width + 20; i += 8) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - groundHeight + 15);
                ctx.lineTo(i - 1, canvas.height - groundHeight + 5);
                ctx.lineTo(i, canvas.height - groundHeight + 2);
                ctx.stroke();
            }
            
            // Short grass blades
            ctx.lineWidth = 1.5;
            for (let i = groundX + 6; i < canvas.width + 20; i += 10) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - groundHeight + 12);
                ctx.lineTo(i, canvas.height - groundHeight + 5);
                ctx.stroke();
            }
            
            // Grass clumps (darker patches)
            ctx.fillStyle = '#1B5E20';
            for (let i = groundX; i < canvas.width; i += 30) {
                ctx.beginPath();
                ctx.ellipse(i, canvas.height - groundHeight + 20, 12, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Light grass clumps
            ctx.fillStyle = '#4CAF50';
            for (let i = groundX + 15; i < canvas.width; i += 35) {
                ctx.beginPath();
                ctx.ellipse(i, canvas.height - groundHeight + 18, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Small flowers scattered
            const flowerColors = ['#FFD700', '#FF69B4', '#FF6347', '#FFA500', '#9370DB'];
            for (let i = groundX + 10; i < canvas.width; i += 50) {
                const color = flowerColors[Math.floor((i / 50) % flowerColors.length)];
                ctx.fillStyle = color;
                // Flower petals
                for (let p = 0; p < 5; p++) {
                    const angle = (p * Math.PI * 2) / 5;
                    const px = i + Math.cos(angle) * 3;
                    const py = canvas.height - groundHeight + 12 + Math.sin(angle) * 3;
                    ctx.beginPath();
                    ctx.arc(px, py, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Flower center
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(i, canvas.height - groundHeight + 12, 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Flower stem
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - groundHeight + 14);
                ctx.lineTo(i, canvas.height - groundHeight + 25);
                ctx.stroke();
            }
            
            // Small pebbles in soil
            ctx.fillStyle = '#696969';
            for (let i = groundX + 5; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.arc(i, canvas.height - groundHeight + 55, 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(i + 20, canvas.height - groundHeight + 60, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Update Game
        function update() {
            if (gameState !== 'playing') return;

            // Update bird
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Update invincibility timer
            if (invincible) {
                invincibleTimer--;
                if (invincibleTimer <= 0) {
                    invincible = false;
                }
                updateLivesDisplay();
            }

            // Update pipes and spawn stars
            frameCount++;
            if (frameCount % spawnInterval === 0) {
                const topHeight = Math.random() * (canvas.height - pipeGap - groundHeight - 150) + 70;
                pipes.push({ x: canvas.width, top: topHeight, passed: false });
                
                // Spawn star in the gap (30% chance)
                if (Math.random() < 0.3) {
                    const starY = topHeight + pipeGap / 2;
                    stars.push({ x: canvas.width + 30, y: starY, collected: false });
                }
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= pipeSpeed;
                
                // Check if passed pipe
                if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
                    pipe.passed = true;
                    score++;
                    document.getElementById('scoreDisplay').textContent = score;
                    autoUpdateTimeOfDay(); // Auto change background based on score
                }

                // Remove off-screen pipes
                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(index, 1);
                }
            });

            // Update stars
            stars.forEach((star, index) => {
                star.x -= pipeSpeed;
                
                // Check star collection
                if (!star.collected && 
                    bird.x < star.x + starSize &&
                    bird.x + bird.width > star.x &&
                    bird.y < star.y + starSize &&
                    bird.y + bird.height > star.y) {
                    star.collected = true;
                    score += 5; // Bonus points
                    starsCollected++; // Increment star counter
                    document.getElementById('scoreDisplay').textContent = score;
                    updateStarCounter();
                    autoUpdateTimeOfDay(); // Auto change background based on score
                    stars.splice(index, 1);
                }
                
                // Remove off-screen stars
                if (star.x + starSize < 0) {
                    stars.splice(index, 1);
                }
            });

            // Update ground
            groundX -= pipeSpeed;
            if (groundX <= -20) groundX = 0;

            // Check collisions
            checkCollisions();
        }

        // Check Collisions
        function checkCollisions() {
            if (invincible) return;
            
            // Ground collision
            if (bird.y + bird.height > canvas.height - groundHeight || bird.y < 0) {
                loseLife();
            }

            // Pipe collision
            pipes.forEach(pipe => {
                const capOverlap = (pipeCapWidth - pipeWidth) / 2;
                
                // Body collision
                if (bird.x + bird.width > pipe.x && bird.x < pipe.x + pipeWidth) {
                    if (bird.y < pipe.top - pipeCapHeight || bird.y + bird.height > pipe.top + pipeGap + pipeCapHeight) {
                        loseLife();
                    }
                }
                
                // Cap collision
                if (bird.x + bird.width > pipe.x - capOverlap && bird.x < pipe.x + pipeWidth + capOverlap) {
                    if (bird.y < pipe.top && bird.y + bird.height > pipe.top - pipeCapHeight) {
                        loseLife();
                    }
                    if (bird.y < pipe.top + pipeGap + pipeCapHeight && bird.y + bird.height > pipe.top + pipeGap) {
                        loseLife();
                    }
                }
            });
        }

        // Lose Life
        function loseLife() {
            lives--;
            updateLivesDisplay();
            
            if (lives <= 0) {
                gameOver();
            } else {
                // Invincibility for 2 seconds
                invincible = true;
                invincibleTimer = 120; // 2 seconds at 60fps
                bird.y = 250;
                bird.velocity = 0;
            }
        }

        // Draw
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw sky (canvas already has gradient background)
            drawPipes();
            drawStars();
            drawGround();
            drawBird();
        }

        // Game Loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Jump
        function jump() {
            if (gameState === 'playing') {
                bird.velocity = bird.jump;
            }
        }

        // Start Game
        function startGame() {
            gameState = 'playing';
            init();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('scoreDisplay').style.display = 'block';
            document.getElementById('livesDisplay').style.display = 'block';
            document.getElementById('starCounter').style.display = 'block';
        }

        // Game Over
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHighScore', highScore);
            }

            saveToLeaderboard(score);

            document.getElementById('finalScore').textContent = score;
            document.getElementById('bestScore').textContent = highScore;
            document.getElementById('medalDisplay').textContent = getMedal(score);
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // Get Medal
        function getMedal(score) {
            if (score >= 50) return '🥇 Emas!';
            if (score >= 30) return '🥈 Perak!';
            if (score >= 10) return '🥉 Perunggu!';
            return '💪 Coba Lagi!';
        }

        // Save to Leaderboard
        function saveToLeaderboard(score) {
            let leaderboard = JSON.parse(localStorage.getItem('flappyLeaderboard') || '[]');
            const entry = {
                score: score,
                date: new Date().toLocaleDateString('id-ID'),
                character: selectedCharacter,
                difficulty: difficulty
            };
            leaderboard.push(entry);
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('flappyLeaderboard', JSON.stringify(leaderboard));
        }

        // Show Leaderboard
        function showLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('flappyLeaderboard') || '[]');
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            
            if (leaderboard.length === 0) {
                list.innerHTML = '<div style="color: white; text-align: center; padding: 20px; font-size: 12px; line-height: 1.5;">Belum ada skor</div>';
            } else {
                leaderboard.forEach((entry, index) => {
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';
                    const diffIcon = entry.difficulty === 'hard' ? '😤' : entry.difficulty === 'medium' ? '😐' : '😊';
                    item.innerHTML = `
                        <span><span class="rank">#${index + 1}</span> ${entry.character}${diffIcon}</span>
                        <span>${entry.score}</span>
                    `;
                    list.appendChild(item);
                });
            }
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('leaderboardScreen').classList.remove('hidden');
        }

        // Cycle Time of Day
        function cycleTime() {
            const currentIndex = timeSequence.indexOf(timeOfDay);
            const nextIndex = (currentIndex + 1) % timeSequence.length;
            timeOfDay = timeSequence[nextIndex];
            
            gameContainer.className = 'game-container ' + timeOfDay;
            document.getElementById('timeCycleBtn').textContent = timeIcons[timeOfDay];
        }

        // Event Listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        document.getElementById('startBtn').addEventListener('click', startGame);

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame();
        });

        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('scoreDisplay').style.display = 'none';
            document.getElementById('livesDisplay').style.display = 'none';
            document.getElementById('starCounter').style.display = 'none';
        });

        document.getElementById('selectCharBtn').addEventListener('click', () => {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('characterSelect').classList.remove('hidden');
        });

        document.getElementById('selectPipeBtn').addEventListener('click', () => {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('pipeSelect').classList.remove('hidden');
        });

        document.getElementById('backFromCharBtn').addEventListener('click', () => {
            document.getElementById('characterSelect').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        });

        document.getElementById('backFromPipeBtn').addEventListener('click', () => {
            document.getElementById('pipeSelect').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        });

        document.getElementById('leaderboardBtn').addEventListener('click', showLeaderboard);

        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('leaderboardScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        });

        // Character Selection
        document.querySelectorAll('.character-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.character-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedCharacter = card.dataset.char;
            });
        });

        // Difficulty Selection
        document.querySelectorAll('.difficulty-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                difficulty = card.dataset.difficulty;
            });
        });

        // Pipe Type Selection
        document.querySelectorAll('.pipe-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.pipe-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedPipeType = card.dataset.pipe;
            });
        });

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
